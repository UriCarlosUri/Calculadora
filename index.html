<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suite Científica & Robótica Didáctica</title>
  <style>
    :root {
      --bg: #0b1120;
      --card: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
      --warn: #ef4444;
      --gold: #f59e0b;
      --success: #10b981;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
    }
    .box {
      max-width: 800px;
      width: 100%;
      background: var(--card);
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
    h1 { color: var(--accent); text-align: center; margin-top: 0; font-size: 1.6rem; }
    p.sub { text-align: center; color: var(--muted); margin-bottom: 20px; font-size: 0.9rem; }

    /* Pestañas */
    .nav-tabs, .sub-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    button.tab {
      flex: 1; min-width: 120px; padding: 10px; background: #0f172a;
      border: 1px solid var(--border); color: var(--muted);
      border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s;
    }
    button.tab.active { background: var(--accent); color: #0b1120; border-color: var(--accent); }
    button.tab.challenge { border-color: var(--gold); color: #fde68a; }
    button.tab.challenge.active { background: var(--gold); color: #0b1120; }

    .modulo { display: none; }
    .modulo.active { display: block; }
    .form-group { margin-bottom: 12px; }
    label { display: block; margin-bottom: 4px; font-size: 0.85rem; color: var(--muted); }
    input, select {
      width: 100%; box-sizing: border-box; padding: 10px;
      border-radius: 6px; border: 1px solid var(--border);
      background: #0f172a; color: #fff; font-size: 0.95rem;
    }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    .grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; }

    .btn-row { display: flex; gap: 8px; margin-top: 10px; }
    button.btn-calc {
      flex: 3; padding: 12px; background: var(--accent);
      color: #0b1120; border: none; border-radius: 8px;
      font-weight: bold; font-size: 1rem; cursor: pointer;
    }
    button.btn-code {
      flex: 1; min-width: 100px; padding: 12px; background: #334155;
      color: #38bdf8; border: 1px solid var(--accent); border-radius: 8px;
      font-weight: 600; font-size: 0.85rem; cursor: pointer;
    }

    /* Gráfico Resistencia */
    .resistor-display {
      background: #334155; padding: 16px; border-radius: 10px;
      display: flex; justify-content: center; margin: 12px 0;
    }
    .resistor-body {
      width: 220px; height: 42px; background: #d4a373;
      border-radius: 20px; display: flex; justify-content: space-around;
      align-items: center; padding: 0 16px;
    }
    .banda { width: 14px; height: 100%; }

    /* Simulador LED */
    .led-sim-container {
      background: #070d19; border: 1px solid var(--border);
      border-radius: 12px; padding: 16px; margin-top: 14px; text-align: center;
    }
    .led-visual-wrap { position: relative; display: inline-block; width: 80px; height: 90px; }
    .led-bulb {
      width: 44px; height: 50px; border-radius: 22px 22px 6px 6px;
      background: #475569; margin: 0 auto; transition: all 0.3s;
      position: relative;
    }
    .led-pins {
      width: 16px; height: 35px; border-left: 3px solid #94a3b8;
      border-right: 3px solid #94a3b8; margin: 0 auto;
    }
    .smoke {
      position: absolute; top: -15px; left: 50%; transform: translateX(-50%);
      font-size: 24px; opacity: 0; transition: opacity 0.3s;
    }
    .led-burned { background: #18181b !important; box-shadow: none !important; border: 1px dashed #ef4444; }
    .led-burned + .led-pins + .smoke { opacity: 1; animation: floatSmoke 1.5s infinite; }
    @keyframes floatSmoke {
      0% { transform: translate(-50%, 0) scale(0.8); opacity: 0.8; }
      100% { transform: translate(-50%, -20px) scale(1.3); opacity: 0; }
    }

    /* Simulador Servo */
    .servo-box { display: flex; align-items: center; justify-content: center; gap: 20px; margin: 14px 0; }
    .servo-svg { width: 120px; height: 120px; background: #0f172a; border-radius: 10px; border: 1px solid var(--border); }

    /* Resultados */
    #salida {
      margin-top: 20px; background: #070d19; padding: 16px;
      border-radius: 10px; border: 1px solid var(--border); display: none;
    }
    .step {
      margin: 8px 0; padding-left: 10px; border-left: 3px solid var(--accent);
      font-size: 0.9rem; line-height: 1.4;
    }
