<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suite Científica: Robótica, Física, Cálculo & Química</title>
  <style>
    :root {
      --bg: #0b1120;
      --card: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --step-bg: #070d19;
      --highlight: #f59e0b;
      --chem: #34d399;
      --code-bg: #111827;
      --border: #334155;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      max-width: 760px;
      width: 100%;
      background: var(--card);
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.5);
    }
    h1 {
      margin-top: 0;
      font-size: 1.65rem;
      color: var(--accent);
      text-align: center;
    }
    p.sub {
      text-align: center;
      color: var(--text-muted);
      margin-bottom: 24px;
      font-size: 0.95rem;
    }
    
    /* NIVEL 1: Selector de Materia */
    .nav-materia {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .btn-materia {
      flex: 1;
      min-width: 140px;
      padding: 12px 8px;
      border: 2px solid var(--border);
      background: #0f172a;
      color: var(--text-muted);
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 700;
      transition: all 0.2s;
    }
    .btn-materia.active {
      background: var(--accent);
      color: #0b1120;
      border-color: var(--accent);
    }

    /* NIVEL 2: Módulos por materia */
    .nav-operacion {
      display: flex;
      gap: 8px;
      margin-bottom: 22px;
      flex-wrap: wrap;
    }
    .btn-op {
      flex: 1;
      min-width: 120px;
      padding: 8px 12px;
      border: 1px solid var(--border);
      background: #1e293b;
      color: var(--text-muted);
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.2s;
    }
    .btn-op.active {
      background: #334155;
      color: var(--accent);
      border-color: var(--accent);
    }

    /* Formularios */
    .form-box { display: none; }
    .form-box.active { display: block; }
    .form-group { margin-bottom: 14px; }
    label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.88rem;
      color: var(--text-muted);
    }
    input, select {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #0f172a;
      color: #fff;
      font-size: 1rem;
    }
    input:focus, select:focus {
      outline: none;
      border-color: var(--accent);
    }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    .grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }

    button.calc-btn {
      width: 100%;
      padding: 12px;
      background: var(--accent);
      color: #0b1120;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
    }
    button.calc-btn:hover { background: var(--accent-hover); }

    /* Visualizador gráfico de Resistencia */
    .resistor-preview {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #334155;
      padding: 20px;
      border-radius: 12px;
      margin: 15px 0;
    }
    .resistor-body {
      width: 220px;
      height: 48px;
      background: #d4a373;
      border-radius: 24px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 0 16px;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.4);
    }
    .banda {
      width: 14px;
      height: 100%;
      box-shadow: 0 0 3px rgba(0,0,0,0.5);
    }

    /* Salidas de procedimiento */
    .procedimiento {
      margin-top: 24px;
      background: var(--step-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      display: none;
    }
    .procedimiento h3 {
      margin-top: 0;
      color: var(--accent);
      font-size: 1.15rem;
    }
    .step {
      margin: 10px 0;
      padding-left: 12px;
      border-left: 3px solid var(--accent);
      line-height: 1.5;
      font-size: 0.92rem;
    }
    code {
      background: rgba(255, 255, 255, 0.08);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
      color: #38bdf8;
    }
    .chem-tip {
      margin-top: 15px;
      padding: 12px;
      background: rgba(52, 211, 153, 0.1);
      border-left: 3px solid var(--chem);
      border-radius: 4px;
      font-size: 0.88rem;
      color: #a7f3d0;
    }
    .robotics-tip {
      margin-top: 15px;
      padding: 12px;
      background: rgba(245, 158, 11, 0.1);
      border-left: 3px solid var(--highlight);
      border-radius: 4px;
      font-size: 0.88rem;
      color: #fde68a;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Calculadora Didáctica Multidisciplinaria</h1>
  <p class="sub">Aprende qué significa cada fórmula, cómo se calcula a mano y cómo se aplica en robótica y ciencias.</p>

  <!-- NIVEL 1: Materia Principal -->
  <div class="nav-materia">
    <button class="btn-materia active" onclick="seleccionarMateria('robotica')">🤖 Robótica & Circuitos</button>
    <button class="btn-materia" onclick="seleccionarMateria('quimica')">🧪 Química</button>
    <button class="btn-materia" onclick="seleccionarMateria('fisica')">🚀 Física Mecánica</button>
    <button class="btn-materia" onclick="seleccionarMateria('calculo')">📐 Cálculo</button>
  </div>

  <!-- NIVEL 2: Módulos Robótica -->
  <div id="sub-robotica" class="nav-operacion">
    <button class="btn-op active" onclick="seleccionarOp('res-color')">Código de Colores (Resistencias)</button>
    <button class="btn-op" onclick="seleccionarOp('led-ohm')">Resistor para LED</button>
    <button class="btn-op" onclick="seleccionarOp('divisor')">Divisor de Tensión (Sensores)</button>
  </div>

  <!-- NIVEL 2: Módulos Química -->
  <div id="sub-quimica" class="nav-operacion" style="display: none;">
    <button class="btn-op" onclick="seleccionarOp('quim-molar')">Masa Molar (Compuestos)</button>
    <button class="btn-op" onclick="seleccionarOp('quim-gases')">Gases Ideales (P·V = n·R·T)</button>
    <button class="btn-op" onclick="seleccionarOp('quim-molaridad')">Molaridad (Soluciones)</button>
  </div>

  <!-- NIVEL 2: Módulos Física -->
  <div id="sub-fisica" class="nav-operacion" style="display: none;">
    <button class="btn-op" onclick="seleccionarOp('cinematica')">Cinemática (MRUA)</button>
    <button class="btn-op" onclick="seleccionarOp('dinamica')">Leyes de Newton (F=m·a)</button>
  </div>

  <!-- NIVEL 2: Módulos Cálculo -->
  <div id="sub-calculo" class="nav-operacion" style="display: none;">
    <button class="btn-op" onclick="seleccionarOp('derivada')">Derivadas</button>
    <button class="btn-op" onclick="seleccionarOp('int-def')">Integral Definida (Área)</button>
  </div>

  <!-- ================= FORMULARIO: CÓDIGO DE COLORES ================= -->
  <div id="form-res-color" class="form-box active">
    <label>Identificador de Resistencias (4 Bandas):</label>
    
    <div class="resistor-preview">
      <div class="resistor-body">
        <div id="banda1" class="banda" style="background: #a52a2a;"></div>
        <div id="banda2" class="banda" style="background: #000000;"></div>
        <div id="banda3" class="banda" style="background: #a52a2a;"></div>
        <div id="banda4" class="banda" style="background: #ffd700;"></div>
      </div>
    </div>

    <div class="grid-4">
      <div class="form-group">
        <label>1ª Banda (Dígito):</label>
        <select id="c-b1" onchange="actualizarColores()">
          <option value="0" data-hex="#000000">Negro (0)</option>
          <option value="1" data-hex="#a52a2a" selected>Marrón (1)</option>
          <option value="2" data-hex="#ef4444">Rojo (2)</option>
          <option value="3" data-hex="#f97316">Naranja (3)</option>
          <option value="4" data-hex="#eab308">Amarillo (4)</option>
          <option value="5" data-hex="#22c55e">Verde (5)</option>
          <option value="6" data-hex="#3b82f6">Azul (6)</option>
          <option value="7" data-hex="#a855f7">Violeta (7)</option>
          <option value="8" data-hex="#6b7280">Gris (8)</option>
          <option value="9" data-hex="#ffffff">Blanco (9)</option>
        </select>
      </div>

      <div class="form-group">
        <label>2ª Banda (Dígito):</label>
        <select id="c-b2" onchange="actualizarColores()">
          <option value="0" data-hex="#000000" selected>Negro (0)</option>
          <option value="1" data-hex="#a52a2a">Marrón (1)</option>
          <option value="2" data-hex="#ef4444">Rojo (2)</option>
          <option value="3" data-hex="#f97316">Naranja (3)</option>
          <option value="4" data-hex="#eab308">Amarillo (4)</option>
          <option value="5" data-hex="#22c55e">Verde (5)</option>
          <option value="6" data-hex="#3b82f6">Azul (6)</option>
          <option value="7" data-hex="#a855f7">Violeta (7)</option>
          <option value="8" data-hex="#6b7280">Gris (8)</option>
          <option value="9" data-hex="#ffffff">Blanco (9)</option>
        </select>
      </div>

      <div class="form-group">
        <label>Multiplicador (10ⁿ):</label>
        <select id="c-b3" onchange="actualizarColores()">
          <option value="1" data-hex="#000000">x1 (Negro)</option>
          <option value="10" data-hex="#a52a2a">x10 (Marrón)</option>
          <option value="100" data-hex="#ef4444" selected>x100 (Rojo)</option>
          <option value="1000" data-hex="#f97316">x1k (Naranja)</option>
          <option value="10000" data-hex="#eab308">x10k (Amarillo)</option>
          <option value="100000" data-hex="#22c55e">x100k (Verde)</option>
          <option value="1000000" data-hex="#3b82f6">x1M (Azul)</option>
          <option value="0.1" data-hex="#ffd700">x0.1 (Oro)</option>
          <option value="0.01" data-hex="#c0c0c0">x0.01 (Plata)</option>
        </select>
      </div>

      <div class="form-group">
        <label>Tolerancia:</label>
        <select id="c-b4" onchange="actualizarColores()">
          <option value="5" data-hex="#ffd700" selected>±5% (Oro)</option>
          <option value="10" data-hex="#c0c0c0">±10% (Plata)</option>
          <option value="1" data-hex="#a52a2a">±1% (Marrón)</option>
          <option value="2" data-hex="#ef4444">±2% (Rojo)</option>
        </select>
      </div>
    </div>
    <button class="calc-btn" onclick="resolverCodigoColores()">Calcular Valor en Ohms y Tolerancia</button>
  </div>

  <!-- ================= FORMULARIOS QUÍMICA ================= -->
  <div id="form-quim-molar" class="form-box">
    <label>Calculadora de Masa Molar (Compuestos comunes):</label>
    <div class="form-group">
      <label>Selecciona una molécula para analizar:</label>
      <select id="qm-formula">
        <option value="H2O">Agua (H₂O)</option>
        <option value="CO2">Dióxido de Carbono (CO₂)</option>
        <option value="NaCl">Sal común / Cloruro de Sodio (NaCl)</option>
        <option value="C6H12O6">Glucosa (C₆H₁₂O₆)</option>
        <option value="CH4">Metano (CH₄)</option>
        <option value="HCl">Ácido Clorhídrico (HCl)</option>
        <option value="NaOH">Hidróxido de Sodio (NaOH)</option>
      </select>
    </div>
    <button class="calc-btn" onclick="resolverMasaMolar()">Desglosar Masa Molar y % de Elementos</button>
  </div>

  <div id="form-quim-gases" class="form-box">
    <label>Ley de Gases Ideales: <b>P · V = n · R · T</b></label>
    <div class="grid-3">
      <div class="form-group"><label>Presión (P) [atm]:</label><input type="number" id="gas-p" value="1" step="any"></div>
      <div class="form-group"><label>Volumen (V) [Litros]:</label><input type="number" id="gas-v" value="22.4" step="any"></div>
      <div class="form-group"><label>Temperatura [°C]:</label><input type="number" id="gas-t" value="0" step="any"></div>
    </div>
    <button class="calc-btn" onclick="resolverGases()">Calcular Moles (n)</button>
  </div>

  <div id="form-quim-molaridad" class="form-box">
    <label>Concentración de Soluciones: <b>Molaridad (M = mol / L)</b></label>
    <div class="grid-2">
      <div class="form-group"><label>Moles de soluto (n):</label><input type="number" id="mol-n" value="0.5" step="any"></div>
      <div class="form-group"><label>Volumen de disolución [Litros]:</label><input type="number" id="mol-v" value="2" step="any"></div>
    </div>
    <button class="calc-btn" onclick="resolverMolaridad()">Calcular Molaridad Paso a Paso</button>
  </div>

  <!-- ================= FORMULARIOS ROBÓTICA ADICIONALES ================= -->
  <div id="form-led-ohm" class="form-box">
    <label>Cálculo de resistor para LED en Arduino:</label>
    <div class="grid-3">
      <div class="form-group"><label>Pin Arduino (Vcc) [V]:</label><input type="number" id="ohm-vcc" value="5" step="any"></div>
      <div class="form-group"><label>Caída de LED (Vled) [V]:</label><input type="number" id="ohm-vled" value="2" step="any"></div>
      <div class="form-group"><label>Corriente (I) [mA]:</label><input type="number" id="ohm-i" value="20" step="any"></div>
    </div>
    <button class="calc-btn" onclick="resolverLedOhm()">Calcular Resistor Requerido</button>
  </div>

  <div id="form-divisor" class="form-box">
    <label>Divisor de voltaje (Sensores analógicos con Arduino):</label>
    <div class="grid-3">
      <div class="form-group"><label>Voltaje Vin [V]:</label><input type="number" id="div-vin" value="5" step="any"></div>
      <div class="form-group"><label>Resistencia fija (R1) [Ω]:</label><input type="number" id="div-r1" value="10000" step="any"></div>
      <div class="form-group"><label>Resistencia sensor (R2) [Ω]:</label><input type="number" id="div-r2" value="5000" step="any"></div>
    </div>
    <button class="calc-btn" onclick="resolverDivisor()">Calcular Voltaje y Lectura ADC</button>
  </div>

  <!-- ================= FORMULARIOS FÍSICA Y CÁLCULO ================= -->
  <div id="form-cinematica" class="form-box">
    <label>Cinemática (MRUA):</label>
    <div class="grid-3">
      <div class="form-group"><label>v₀ [m/s]:</label><input type="number" id="cin-v0" value="0" step="any"></div>
      <div class="form-group"><label>a [m/s²]:</label><input type="number" id="cin-a" value="2.5" step="any"></div>
      <div class="form-group"><label>t [s]:</label><input type="number" id="cin-t" value="4" step="any"></div>
    </div>
    <button class="calc-btn" onclick="resolverCinematica()">Calcular Cinemática</button>
  </div>

  <div id="form-dinamica" class="form-box">
    <label>Segunda Ley de Newton (F = m · a):</label>
    <div class="grid-2">
      <div class="form-group"><label>Masa (m) [kg]:</label><input type="number" id="din-m" value="1.5" step="any"></div>
      <div class="form-group"><label>Aceleración (a) [m/s²]:</label><input type="number" id="din-a" value="3" step="any"></div>
    </div>
    <button class="calc-btn" onclick="resolverDinamica()">Calcular Fuerza Requerida</button>
  </div>

  <div id="form-derivada" class="form-box">
    <label>Derivada polinomial: <b>c · xⁿ</b></label>
    <div class="grid-2">
      <div class="form-group"><label>Coeficiente (c):</label><input type="number" id="der-c" value="6" step="any"></div>
      <div class="form-group"><label>Exponente (n):</label><input type="number" id="der-n" value="3" step="any"></div>
    </div>
    <button class="calc-btn" onclick="resolverDerivada()">Calcular Derivada</button>
  </div>

  <div id="form-int-def" class="form-box">
    <label>Integral Definida: <b>∫ₐᵇ (c · xⁿ) dx</b></label>
    <div class="grid-2">
      <div class="form-group"><label>Coeficiente (c):</label><input type="number" id="intdef-c" value="3" step="any"></div>
      <div class="form-group"><label>Exponente (n):</label><input type="number" id="intdef-n" value="2" step="any"></div>
    </div>
    <div class="grid-2">
      <div class="form-group"><label>Límite inf (a):</label><input type="number" id="intdef-a" value="0" step="any"></div>
      <div class="form-group"><label>Límite sup (b):</label><input type="number" id="intdef-b" value="2" step="any"></div>
    </div>
    <button class="calc-btn" onclick="resolverIntegralDef()">Calcular Área</button>
  </div>

  <!-- PANEL DE SALIDA -->
  <div id="salida" class="procedimiento"></div>
</div>

<script>
  function seleccionarMateria(materia) {
    document.querySelectorAll('.btn-materia').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.nav-operacion').forEach(n => n.style.display = 'none');
    document.getElementById('salida').style.display = 'none';

    if (materia === 'robotica') {
      document.querySelectorAll('.btn-materia')[0].classList.add('active');
      document.getElementById('sub-robotica').style.display = 'flex';
      seleccionarOp('res-color');
    } else if (materia === 'quimica') {
      document.querySelectorAll('.btn-materia')[1].classList.add('active');
      document.getElementById('sub-quimica').style.display = 'flex';
      seleccionarOp('quim-molar');
    } else if (materia === 'fisica') {
      document.querySelectorAll('.btn
